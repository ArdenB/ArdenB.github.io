###########################################################
### Beautiful Jekyll v6 — used as a remote theme.
### Theme source: https://github.com/daattali/beautiful-jekyll
###########################################################

remote_theme: daattali/beautiful-jekyll@6.0.1

############################
# --- Required options --- #
############################

# Name of website
title: Arden Burrell

# Your name to show in the footer
author: Arden Burrell

# The full URL of your site (used for SEO and canonical links)
url: "https://ardenburrell.com"
baseurl: ""

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  Research: "aboutme"
  Publications: "pubs"
  Curriculum Vitae: "CV"
  Google Scholar: "https://scholar.google.com.au/citations?user=3a4e-tcAAAAJ&hl=en"
  Resources:
    - TSS.RESTREND: "https://github.com/ArdenB/TSSRESTREND"

################
# --- Logo --- #
################

# Image logo shown in the top-left corner instead of the title text
title-img: /img/BWimage.jpg

#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  email: "arden.burrell@sydney.edu.au"
  github: ArdenB
  google-scholar: "citations?user=3a4e-tcAAAAJ&hl=en"
  ORCID: "0000-0001-8762-1296"

###########################
# --- General options --- #
###########################

# Add a search button to the navbar
post_search: false

# Add a button in the footer to edit the current page (GitHub-hosted sites only)
edit_page_button: false

# The keywords to associate with your website, for SEO purposes
keywords: "Arden Burrell,remote sensing,data science,machine learning,plant phenomics,land degradation,boreal forest,climate"

######################################
# --- Colours / background image --- #
######################################

navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

################
# --- Misc --- #
################

# Ruby Date Format to show dates of posts
date_format: "%B %-d, %Y"

#################################################################################
# --- You don't need to touch anything below here (but you can if you want) --- #
#################################################################################

# Output options (more information on Jekyll's site)
timezone: "Australia/Sydney"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/

kramdown:
  input: GFM

# Default YAML values
defaults:
  -
    scope:
      path: "" # any file that's not a post will be a "page" layout by default
    values:
      layout: "page"

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md

plugins:
  - jekyll-sitemap
